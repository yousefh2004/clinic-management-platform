<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img src="images/logo.png" alt="MedCare Logo" class="brand-logo" width="100px">
      <span class="brand-name">MedCare Clinic</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/departments" routerLinkActive="active">
        <mat-icon>apartment</mat-icon>
        <span>Departments</span>
      </a>
      <a routerLink="/doctors" routerLinkActive="active">
        <mat-icon>vaccines</mat-icon>
        <span>Doctors</span>
      </a>
      <a routerLink="/patients" routerLinkActive="active">
        <mat-icon>groups</mat-icon>
        <span>Patients</span>
      </a>
      <a routerLink="/appointments" routerLinkActive="active">
        <mat-icon>event</mat-icon>
        <span>Appointments</span>
      </a>
    </nav>

        @if (authService.currentUser()?.role === 'ADMIN') {
      <button class="add-user-btn" (click)="openCreateUserDialog()">
        <mat-icon>person_add</mat-icon>
        <span>Add Staff User</span>
      </button>
    }

    <button class="logout-btn" (click)="authService.logout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
