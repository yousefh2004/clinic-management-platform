<div class="page-wrapper">
  <div class="page-header">
    <h1 class="page-title">Departments</h1>
  </div>

  <div class="content-card">
    <div class="toolbar">
      <mat-form-field appearance="fill" class="search-field">
        <mat-label>Search by name</mat-label>
        <input matInput [formControl]="searchControl" placeholder="e.g. Cardiology">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" class="add-btn" (click)="goToCreate()">
        <mat-icon>add</mat-icon>
        Add Department
      </button>
    </div>

    <table mat-table [dataSource]="departments" class="department-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let dept">{{ dept.name }}</td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let dept">{{ dept.code }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let dept">
          <button mat-icon-button (click)="goToEdit(dept.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="confirmDelete(dept)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</div>
