<div class="page-wrapper">
  <div class="page-header">
    <h1 class="page-title">Patients</h1>
  </div>

  <div class="content-card">
    <div class="toolbar">
      <mat-form-field appearance="fill" class="search-field">
        <mat-label>Search by name</mat-label>
        <input matInput [formControl]="nameControl">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="fill" class="search-field">
        <mat-label>Search by phone</mat-label>
        <input matInput [formControl]="phoneControl">
        <mat-icon matSuffix>call</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" class="add-btn">
        <mat-icon>add</mat-icon>
        Add Patient
      </button>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="patients()" matSort (matSortChange)="onSortChange($event)" class="patient-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="firstName">Name</th>
          <td mat-cell *matCellDef="let p">{{ p.firstName }} {{ p.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let p">{{ p.phoneNumber }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let p">{{ p.email || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let p">
            <span class="status-badge" [class.active]="p.active" [class.inactive]="!p.active">
              {{ p.active ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button>
              <mat-icon>edit</mat-icon>
            </button>
            @if (p.active) {
              <button mat-icon-button (click)="confirmDeactivate(p)">
                <mat-icon>block</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [hidePageSize]="true"
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</div>
